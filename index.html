<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ลอยกระทงออนไลน์ รักษ์โลก ลดโลกร้อน (แต่งกระทงเองได้)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>

    :root {

      --bg-sky-top: #070d1f;

      --bg-sky-mid: #102145;

      --bg-sky-low: #1b3668;

      --water-top: #0c2240;

      --water-bottom: #050f1f;

      --gold: #ffd166;

      --gold-deep: #f4a261;

      --emerald: #2ec4b6;

      --glass-bg: rgba(12, 24, 48, 0.78);

      --glass-border: rgba(255, 209, 102, 0.28);

      --text-main: #f8fafc;

      --text-muted: #cbd5e1;

    }

    * {

      box-sizing: border-box;

      margin: 0;

      padding: 0;

      font-family: 'Prompt', sans-serif;

    }

    body {

      background: var(--bg-sky-top);

      color: var(--text-main);

      min-height: 100vh;

      overflow: hidden;

      position: relative;

      user-select: none;

    }

    /* Sky & Background Scenery */

    .scene {

      position: fixed;

      inset: 0;

      background: linear-gradient(180deg, var(--bg-sky-top) 0%, var(--bg-sky-mid) 36%, var(--bg-sky-low) 54%, var(--water-top) 54.5%, var(--water-bottom) 100%);

      overflow: hidden;

      z-index: 1;

    }

    #fireworksCanvas {

      position: absolute;

      top: 0;

      left: 0;

      width: 100%;

      height: 56%;

      pointer-events: none;

      z-index: 2;

    }

    .stars {

      position: absolute;

      top: 0;

      left: 0;

      width: 100%;

      height: 52%;

      pointer-events: none;

      z-index: 1;

    }

    .star {

      position: absolute;

      background: #fff;

      border-radius: 50%;

      animation: twinkle var(--dur, 3s) infinite ease-in-out alternate;

    }

    @keyframes twinkle {

      0% { opacity: 0.2; transform: scale(0.8); }

      100% { opacity: 1; transform: scale(1.2); }

    }

    .moon {

      position: absolute;

      top: 9%;

      right: 14%;

      width: 92px;

      height: 92px;

      border-radius: 50%;

      background: radial-gradient(circle at 35% 35%, #fffbe6 0%, #ffe699 55%, #ffd166 100%);

      box-shadow: 0 0 40px rgba(255, 225, 130, 0.65), 0 0 90px rgba(255, 209, 102, 0.3);

      z-index: 2;

    }

    .skyline {

      position: absolute;

      top: calc(54.5% - 125px);

      left: 0;

      width: 100%;

      height: 130px;

      pointer-events: none;

      z-index: 3;

      opacity: 0.9;

    }

    .moon-reflection {

      position: absolute;

      top: 55%;

      right: 12%;

      width: 130px;

      height: 45%;

      background: radial-gradient(ellipse at top, rgba(255, 224, 130, 0.25) 0%, rgba(255, 209, 102, 0.05) 55%, transparent 80%);

      filter: blur(8px);

      pointer-events: none;

      z-index: 2;

    }

    .water-shimmer {

      position: absolute;

      top: 54.5%;

      left: 0;

      width: 100%;

      height: 45.5%;

      background-image: repeating-linear-gradient(

        180deg,

        rgba(255, 255, 255, 0.03) 0px,

        rgba(255, 255, 255, 0.03) 2px,

        transparent 2px,

        transparent 18px

      );

      animation: waterDrift 6s linear infinite;

      pointer-events: none;

      z-index: 2;

    }

    @keyframes waterDrift {

      0% { background-position: 0 0; }

      100% { background-position: 0 36px; }

    }

    /* River Area */

    .river-area {

      position: absolute;

      top: 54.5%;

      left: 0;

      width: 100%;

      height: 45.5%;

      z-index: 5;

      overflow: hidden;

    }

    .krathong-item {

      position: absolute;

      cursor: pointer;

      display: flex;

      flex-direction: column;

      align-items: center;

      transition: filter 0.2s ease, transform 0.2s ease;

      will-change: left, transform;

    }

    .krathong-item:hover {

      filter: drop-shadow(0 0 14px rgba(255, 209, 102, 0.9));

      z-index: 50 !important;

    }

    .krathong-bob {

      animation: bobbing var(--bob-dur, 3.4s) ease-in-out infinite alternate;

      display: flex;

      flex-direction: column;

      align-items: center;

    }

    @keyframes bobbing {

      0% { transform: translateY(0px) rotate(-1.8deg); }

      100% { transform: translateY(-7px) rotate(1.8deg); }

    }

    .krathong-label {

      background: rgba(8, 18, 38, 0.82);

      border: 1px solid rgba(255, 209, 102, 0.45);

      color: #fff;

      font-size: 12px;

      padding: 3px 10px;

      border-radius: 999px;

      white-space: nowrap;

      max-width: 185px;

      overflow: hidden;

      text-overflow: ellipsis;

      margin-bottom: 2px;

      backdrop-filter: blur(4px);

      box-shadow: 0 4px 10px rgba(0,0,0,0.35);

    }

    .krathong-item.is-mine .krathong-label {

      background: linear-gradient(135deg, rgba(244, 162, 97, 0.95), rgba(231, 111, 81, 0.95));

      border-color: #fff3b0;

      font-weight: 600;

      color: #fff;

    }

    .ripple-ring {

      width: 90px;

      height: 20px;

      border-radius: 50%;

      border: 1.5px solid rgba(144, 224, 239, 0.45);

      margin-top: -12px;

      animation: rippleExpand 3s infinite ease-out;

      pointer-events: none;

    }

    @keyframes rippleExpand {

      0% { transform: scale(0.75); opacity: 0.75; }

      100% { transform: scale(1.45); opacity: 0; }

    }

    /* Top Bar */

    .top-bar {

      position: fixed;

      top: 0;

      left: 0;

      width: 100%;

      z-index: 20;

      padding: 14px 20px;

      display: flex;

      flex-wrap: wrap;

      justify-content: space-between;

      align-items: center;

      gap: 12px;

      background: linear-gradient(180deg, rgba(5, 11, 26, 0.88) 0%, rgba(5, 11, 26, 0) 100%);

    }

    .brand {

      display: flex;

      align-items: center;

      gap: 10px;

    }

    .brand-badge {

      background: linear-gradient(135deg, #2d6a4f, #40916c);

      border: 1px solid #95d5b2;

      color: #e9f5db;

      font-size: 12px;

      font-weight: 600;

      padding: 4px 10px;

      border-radius: 999px;

      display: flex;

      align-items: center;

      gap: 5px;

    }

    .live-dot {

      width: 8px;

      height: 8px;

      border-radius: 50%;

      background: #80ed99;

      box-shadow: 0 0 8px #80ed99;

      animation: livePulse 1.5s infinite;

    }

    @keyframes livePulse {

      0%, 100% { opacity: 1; transform: scale(1); }

      50% { opacity: 0.4; transform: scale(0.8); }

    }

    .brand h1 {

      font-size: 20px;

      font-weight: 700;

      background: linear-gradient(90deg, #fff3b0, #ffd166);

      -webkit-background-clip: text;

      -webkit-text-fill-color: transparent;

    }

    /* Eco Counter */

    .eco-dashboard {

      display: flex;

      align-items: center;

      gap: 14px;

      background: var(--glass-bg);

      border: 1px solid rgba(82, 183, 136, 0.45);

      padding: 8px 16px;

      border-radius: 16px;

      backdrop-filter: blur(10px);

      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);

      transition: box-shadow 0.4s ease, border-color 0.4s ease;

    }

    .eco-dashboard.pulse {

      border-color: #ffd166;

      box-shadow: 0 0 24px rgba(82, 183, 136, 0.75);

    }

    .eco-stat {

      display: flex;

      flex-direction: column;

      align-items: center;

      padding: 0 6px;

    }

    .eco-stat:not(:last-child) {

      border-right: 1px solid rgba(255, 255, 255, 0.14);

      padding-right: 14px;

    }

    .eco-val {

      font-size: 16px;

      font-weight: 700;

      color: #80ed99;

      line-height: 1.2;

    }

    .eco-lbl {

      font-size: 11px;

      color: var(--text-muted);

    }

    /* Bottom Action Controls */

    .bottom-controls {

      position: fixed;

      bottom: 22px;

      left: 50%;

      transform: translateX(-50%);

      z-index: 25;

      display: flex;

      gap: 12px;

      align-items: center;

    }

    .btn-primary {

      background: linear-gradient(135deg, #ffd166 0%, #f4a261 100%);

      color: #1b1507;

      border: none;

      padding: 13px 26px;

      border-radius: 999px;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;

      display: flex;

      align-items: center;

      gap: 8px;

      box-shadow: 0 8px 25px rgba(244, 162, 97, 0.45);

      transition: transform 0.2s ease, box-shadow 0.2s ease;

    }

    .btn-primary:hover {

      transform: translateY(-2px) scale(1.02);

      box-shadow: 0 12px 30px rgba(244, 162, 97, 0.65);

    }

    .btn-secondary {

      background: var(--glass-bg);

      color: var(--text-main);

      border: 1px solid var(--glass-border);

      padding: 12px 18px;

      border-radius: 999px;

      font-size: 14px;

      font-weight: 500;

      cursor: pointer;

      backdrop-filter: blur(8px);

      transition: background 0.2s ease;

    }

    .btn-secondary:hover {

      background: rgba(25, 45, 85, 0.85);

    }

    /* Modal Backdrop & Studio Card */

    .modal-backdrop {

      position: fixed;

      inset: 0;

      background: rgba(4, 9, 20, 0.82);

      backdrop-filter: blur(7px);

      z-index: 100;

      display: none;

      align-items: center;

      justify-content: center;

      padding: 12px;

      overflow-y: auto;

    }

    .modal-backdrop.active {

      display: flex;

      animation: fadeIn 0.25s ease;

    }

    @keyframes fadeIn {

      from { opacity: 0; }

      to { opacity: 1; }

    }

    .modal-card {

      background: linear-gradient(160deg, #112244 0%, #0b162e 100%);

      border: 1px solid var(--glass-border);

      border-radius: 24px;

      width: 100%;

      max-width: 560px;

      padding: 20px;

      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);

      position: relative;

      max-height: 94vh;

      overflow-y: auto;

    }

    .modal-close {

      position: absolute;

      top: 14px;

      right: 14px;

      width: 34px;

      height: 34px;

      border-radius: 50%;

      border: 1px solid rgba(255,255,255,0.2);

      background: rgba(255,255,255,0.08);

      color: #fff;

      font-size: 18px;

      cursor: pointer;

      display: flex;

      align-items: center;

      justify-content: center;

      z-index: 5;

    }

    .modal-title {

      font-size: 19px;

      font-weight: 700;

      color: var(--gold);

      text-align: center;

      margin-bottom: 2px;

    }

    .modal-subtitle {

      font-size: 12px;

      color: var(--text-muted);

      text-align: center;

      margin-bottom: 12px;

    }

    /* Customizer Live Stage */

    .studio-stage {

      background: radial-gradient(circle at 50% 45%, #1d3c70 0%, #0a1730 85%);

      border: 1px solid rgba(255, 209, 102, 0.3);

      border-radius: 18px;

      padding: 10px;

      display: flex;

      flex-direction: column;

      align-items: center;

      position: relative;

      margin-bottom: 12px;

    }

    .btn-randomize-all {

      position: absolute;

      top: 10px;

      right: 10px;

      background: rgba(255, 209, 102, 0.16);

      border: 1px solid rgba(255, 209, 102, 0.45);

      color: #ffd166;

      font-size: 12px;

      padding: 5px 10px;

      border-radius: 999px;

      cursor: pointer;

      transition: all 0.2s;

    }

    .btn-randomize-all:hover {

      background: rgba(255, 209, 102, 0.3);

      color: #fff;

    }

    .studio-summary {

      font-size: 11px;

      color: #95d5b2;

      margin-top: 2px;

      text-align: center;

    }

    /* 6 Category Tabs */

    .cat-tabs {

      display: flex;

      gap: 6px;

      overflow-x: auto;

      padding-bottom: 6px;

      margin-bottom: 10px;

      scrollbar-width: thin;

    }

    .cat-tab {

      background: rgba(255, 255, 255, 0.06);

      border: 1px solid rgba(255, 255, 255, 0.14);

      color: #cbd5e1;

      padding: 6px 12px;

      border-radius: 999px;

      font-size: 12px;

      font-weight: 500;

      white-space: nowrap;

      cursor: pointer;

      transition: all 0.2s;

    }

    .cat-tab.active {

      background: linear-gradient(135deg, #2d6a4f, #40916c);

      border-color: #95d5b2;

      color: #fff;

      font-weight: 600;

    }

    /* 10 Options Grid per Category */

    .options-grid {

      display: grid;

      grid-template-columns: repeat(5, 1fr);

      gap: 7px;

      margin-bottom: 14px;

    }

    .opt-card {

      background: rgba(255, 255, 255, 0.04);

      border: 1.5px solid rgba(255, 255, 255, 0.12);

      border-radius: 12px;

      padding: 7px 4px;

      text-align: center;

      cursor: pointer;

      transition: all 0.18s ease;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      min-height: 62px;

    }

    .opt-card:hover {

      background: rgba(255, 255, 255, 0.1);

    }

    .opt-card.selected {

      border-color: var(--gold);

      background: rgba(255, 209, 102, 0.16);

      box-shadow: 0 0 12px rgba(255, 209, 102, 0.28);

    }

    .opt-swatch {

      width: 24px;

      height: 24px;

      border-radius: 50%;

      margin-bottom: 4px;

      border: 1.5px solid rgba(255,255,255,0.4);

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 13px;

    }

    .opt-name {

      font-size: 10.5px;

      line-height: 1.2;

      color: #f1f5f9;

      word-break: break-word;

    }

    /* Form Controls */

    .form-group {

      margin-bottom: 12px;

    }

    .form-label-row {

      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 5px;

    }

    .form-group label {

      font-size: 13px;

      font-weight: 500;

      color: #e2e8f0;

    }

    .btn-random-wish {

      background: rgba(82, 183, 136, 0.2);

      border: 1px solid rgba(82, 183, 136, 0.5);

      color: #95d5b2;

      font-size: 12px;

      padding: 3px 10px;

      border-radius: 999px;

      cursor: pointer;

    }

    .form-input, .form-textarea {

      width: 100%;

      background: rgba(6, 13, 28, 0.75);

      border: 1px solid rgba(255, 255, 255, 0.2);

      border-radius: 12px;

      padding: 10px 13px;

      color: #fff;

      font-size: 14px;

      outline: none;

    }

    .form-input:focus, .form-textarea:focus {

      border-color: var(--gold);

    }

    .form-textarea {

      resize: none;

      height: 72px;

    }

    /* E-Card Preview & Actions */

    .ecard-preview-wrap {

      display: flex;

      justify-content: center;

      margin: 10px 0 16px;

    }

    #ecardPreviewImg {

      width: 220px;

      height: 391px;

      border-radius: 16px;

      border: 2px solid rgba(255, 209, 102, 0.55);

      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.6);

      object-fit: cover;

      background: #091326;

    }

    .ecard-actions {

      display: flex;

      flex-direction: column;

      gap: 10px;

    }

    .btn-download {

      background: linear-gradient(135deg, #2ec4b6 0%, #208b81 100%);

      color: #fff;

      border: none;

      padding: 12px 20px;

      border-radius: 12px;

      font-size: 15px;

      font-weight: 600;

      cursor: pointer;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 8px;

      box-shadow: 0 6px 20px rgba(46, 196, 182, 0.35);

    }

    .btn-copy-wish {

      background: rgba(255, 255, 255, 0.08);

      color: #ffd166;

      border: 1px solid rgba(255, 209, 102, 0.35);

      padding: 10px 16px;

      border-radius: 12px;

      font-size: 14px;

      font-weight: 500;

      cursor: pointer;

    }

    /* Toast */

    .toast {

      position: fixed;

      top: 84px;

      left: 50%;

      transform: translateX(-50%) translateY(-20px);

      background: rgba(16, 42, 67, 0.95);

      border: 1px solid #ffd166;

      color: #fff;

      padding: 10px 20px;

      border-radius: 999px;

      font-size: 14px;

      z-index: 200;

      opacity: 0;

      pointer-events: none;

      transition: all 0.3s ease;

    }

    .toast.show {

      opacity: 1;

      transform: translateX(-50%) translateY(0);

    }

    @media (max-width: 640px) {

      .top-bar { justify-content: center; padding: 10px 12px; }

      .brand h1 { font-size: 17px; }

      .eco-dashboard { width: 100%; justify-content: space-around; padding: 6px 10px; gap: 6px; }

      .eco-stat:not(:last-child) { padding-right: 8px; }

      .eco-val { font-size: 14px; }

      .eco-lbl { font-size: 10px; }

      .moon { width: 64px; height: 64px; right: 8%; top: 15%; }

      .options-grid { grid-template-columns: repeat(5, 1fr); gap: 5px; }

      .opt-name { font-size: 9.5px; }

    }
</style>
</head>
<body>
<!-- Background Scene -->
<div class="scene">
<div class="stars" id="starsContainer"></div>
<canvas id="fireworksCanvas"></canvas>
<div class="moon"></div>
<svg class="skyline" viewBox="0 0 1440 160" preserveAspectRatio="none">
<defs>
<linearGradient id="templeGrad" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#1e3a6e" />
<stop offset="100%" stop-color="#09152b" />
</linearGradient>
</defs>
<path d="M0,160 L0,125 Q80,115 160,128 L240,120 L260,85 L280,120 L350,125 L420,125 L420,160 Z" fill="#0d1e3d"/>
<g fill="url(#templeGrad)">
<polygon points="180,130 192,65 204,130" />
<polygon points="192,65 196,42 200,65" />
<polygon points="155,130 163,88 171,130" />
<polygon points="213,130 221,88 229,130" />
<rect x="145" y="128" width="94" height="32" />
</g>
<path d="M520,160 L520,125 Q680,95 840,125 Q1000,95 1160,125 L1160,160 Z" fill="none" stroke="#1d3557" stroke-width="4"/>
<line x1="680" y1="55" x2="680" y2="135" stroke="#274775" stroke-width="5"/>
<line x1="680" y1="62" x2="570" y2="122" stroke="#274775" stroke-width="1.5"/>
<line x1="680" y1="62" x2="615" y2="118" stroke="#274775" stroke-width="1.5"/>
<line x1="680" y1="62" x2="790" y2="122" stroke="#274775" stroke-width="1.5"/>
<line x1="680" y1="62" x2="745" y2="118" stroke="#274775" stroke-width="1.5"/>
<path d="M1140,160 L1140,125 Q1240,108 1340,122 Q1390,112 1440,120 L1440,160 Z" fill="#0b1933"/>
</svg>
<div class="moon-reflection"></div>
<div class="water-shimmer"></div>
<div class="river-area" id="riverArea"></div>
</div>
<!-- Top Header -->
<header class="top-bar">
<div class="brand">
<h1>ลอยกระทงออนไลน์</h1>
<span class="brand-badge"><span class="live-dot"></span> สดร่วมกัน • รักษ์โลก</span>
</div>
<div class="eco-dashboard" id="ecoDashboard">
<div class="eco-stat">
<span class="eco-val" id="statCount">...</span>
<span class="eco-lbl">กระทงออนไลน์ (ใบ)</span>
</div>
<div class="eco-stat">
<span class="eco-val" id="statWaste">...</span>
<span class="eco-lbl">ลดขยะในแม่น้ำ (กก.)</span>
</div>
<div class="eco-stat">
<span class="eco-val" id="statCarbon">...</span>
<span class="eco-lbl">ลดก๊าซเรือนกระจก (kgCO₂e)</span>
</div>
</div>
</header>
<!-- Bottom Action Bar -->
<div class="bottom-controls">
<button class="btn-primary" id="openCreateBtn">
<span>🎨</span> แต่งกระทงเอง & เขียนคำอธิษฐาน
</button>
<button class="btn-secondary" id="myCardBtn" style="display: none;">

      🖼️ ดูการ์ดของฉัน
</button>
</div>
<div class="toast" id="toast"></div>
<!-- Modal 1: Custom Krathong Studio (6 Categories x 10 Items) -->
<div class="modal-backdrop" id="createModal">
<div class="modal-card">
<button class="modal-close" id="closeCreateModal">&times;</button>
<h2 class="modal-title">สตูดิโอประดิษฐ์กระทงรักษ์โลก</h2>
<p class="modal-subtitle">เลือกตกแต่งได้อิสระ 6 หมวด หมวดละ 10 แบบ (รวม 1,000,000 สไตล์!)</p>
<!-- Live SVG Preview Stage -->
<div class="studio-stage">
<button type="button" class="btn-randomize-all" id="randomDesignBtn">🎲 สุ่มแต่งอัตโนมัติ</button>
<div id="liveKrathongPreview"></div>
<div class="studio-summary" id="studioSummary"></div>
</div>
<!-- 6 Category Tabs -->
<div class="cat-tabs" id="catTabs"></div>
<!-- 10 Options Grid -->
<div class="options-grid" id="optionsGrid"></div>
<div class="form-group">
<div class="form-label-row">
<label for="userNameInput">ชื่อผู้ลอยกระทง</label>
</div>
<input type="text" id="userNameInput" class="form-input" placeholder="เช่น น้องใบตอง, ครอบครัวใจดี" maxlength="28" />

      } else if (charmObj.type === 'naga') {

        charmSVG = `
<path d="M33,85 Q22,68 30,52 L35,47 L38,54 Q30,68 40,83 Z" fill="#40916c" stroke="#ffd166" stroke-width="1"/>
<path d="M107,85 Q118,68 110,52 L105,47 L102,54 Q110,68 100,83 Z" fill="#40916c" stroke="#ffd166" stroke-width="1"/>

        `;

      } else if (charmObj.type === 'coins') {

        charmSVG = `
<circle cx="52" cy="96" r="5" fill="#ffd166" stroke="#b5838d" stroke-width="1"/>
<circle cx="70" cy="98" r="5.5" fill="#ffd166" stroke="#b5838d" stroke-width="1"/>
<circle cx="88" cy="96" r="5" fill="#ffd166" stroke="#b5838d" stroke-width="1"/>

        `;

      } else if (charmObj.type === 'flag') {

        charmSVG = `
<line x1="42" y1="84" x2="36" y2="48" stroke="#ffd166" stroke-width="1.5"/>
<polygon points="36,48 50,53 36,58" fill="#ffd166"/>
<line x1="98" y1="84" x2="104" y2="48" stroke="#ffd166" stroke-width="1.5"/>
<polygon points="104,48 90,53 104,58" fill="#ffd166"/>

        `;

      } else if (charmObj.type === 'butterfly') {

        charmSVG = `
<g transform="translate(34, 56) rotate(-15)">
<ellipse cx="-3" cy="0" rx="5" ry="3" fill="#4cc9f0"/>
<ellipse cx="3" cy="0" rx="5" ry="3" fill="#ffd166"/>
</g>
<g transform="translate(106, 56) rotate(15)">
<ellipse cx="-3" cy="0" rx="5" ry="3" fill="#ffd166"/>
<ellipse cx="3" cy="0" rx="5" ry="3" fill="#4cc9f0"/>
</g>

        `;

      } else if (charmObj.type === 'sparkles') {

        charmSVG = `
<g fill="#fff3b0">
<polygon points="34,54 36,59 41,61 36,63 34,68 32,63 27,61 32,59"/>
<polygon points="106,54 108,59 113,61 108,63 106,68 104,63 99,61 104,59"/>
</g>

        `;

      } else if (charmObj.type === 'hearts') {

        charmSVG = `
<path d="M34,62 C34,58 29,58 29,62 C29,65 34,68 34,68 C34,68 39,65 39,62 C39,58 34,58 34,62 Z" fill="#ff758f"/>
<path d="M106,62 C106,58 101,58 101,62 C101,65 106,68 106,68 C106,68 111,65 111,62 C111,58 106,58 106,62 Z" fill="#ff758f"/>

        `;

      } else if (charmObj.type === 'bodhi') {

        charmSVG = `
<path d="M35,76 Q26,64 35,54 Q44,64 35,76 Z" fill="#ffd166" stroke="#f4a261" stroke-width="1"/>
<path d="M105,76 Q96,64 105,54 Q114,64 105,76 Z" fill="#ffd166" stroke="#f4a261" stroke-width="1"/>

        `;

      } else if (charmObj.type === 'ribbon') {

        charmSVG = `
<polygon points="70,96 58,90 58,102" fill="#80ed99"/>
<polygon points="70,96 82,90 82,102" fill="#80ed99"/>
<circle cx="70" cy="96" r="3.5" fill="#ffd166"/>

        `;

      }

      return `
<svg width="${size}" height="${size}" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">

          ${baseSVG}

          ${petalsSVG}

          ${flowersSVG}

          ${incenseSVG}

          ${candleSVG}

          ${charmSVG}
</svg>

      `;

    }

    // --- Studio UI Rendering ---

    function renderStudioUI() {

      document.getElementById('liveKrathongPreview').innerHTML = buildCustomKrathongSVG(currentDesign, 130);

      const bName = CUSTOM_CATEGORIES[0].items[currentDesign.base].name;

      const pName = CUSTOM_CATEGORIES[1].items[currentDesign.petal].name;

      const fName = CUSTOM_CATEGORIES[2].items[currentDesign.flower].name;

      document.getElementById('studioSummary').textContent = `${bName} • ${pName} • ${fName}`;

      const tabsEl = document.getElementById('catTabs');

      tabsEl.innerHTML = '';

      CUSTOM_CATEGORIES.forEach(cat => {

        const btn = document.createElement('button');

        btn.type = 'button';

        btn.className = `cat-tab ${cat.key === activeCategoryKey ? 'active' : ''}`;

        btn.textContent = cat.label;

        btn.onclick = () => {

          activeCategoryKey = cat.key;

          renderStudioUI();

        };

        tabsEl.appendChild(btn);

      });

      const gridEl = document.getElementById('optionsGrid');

      gridEl.innerHTML = '';

      const activeCat = CUSTOM_CATEGORIES.find(c => c.key === activeCategoryKey);

      activeCat.items.forEach(item => {

        const isSelected = currentDesign[activeCategoryKey] === item.id;

        const card = document.createElement('div');

        card.className = `opt-card ${isSelected ? 'selected' : ''}`;

        let swatchHTML = '';

        if (item.icon) {

          swatchHTML = `<div class="opt-swatch" style="background: rgba(255,255,255,0.1);">${item.icon}</div>`;

        } else if (item.c1) {

          const c2 = item.c2 || item.flame || item.c1;

          swatchHTML = `<div class="opt-swatch" style="background: linear-gradient(135deg, ${item.c1} 50%, ${c2} 50%);"></div>`;

        } else {

          swatchHTML = `<div class="opt-swatch" style="background: ${item.color === 'transparent' ? '#334155' : item.color}; font-size:10px;">${item.count}</div>`;

        }

        card.innerHTML = `

          ${swatchHTML}
<div class="opt-name">${item.name}</div>

        `;

        card.onclick = () => {

          currentDesign[activeCategoryKey] = item.id;

          renderStudioUI();

        };

        gridEl.appendChild(card);

      });

    }

    document.getElementById('randomDesignBtn').onclick = () => {

      currentDesign = {

        base: Math.floor(Math.random() * 10),

        petal: Math.floor(Math.random() * 10),

        flower: Math.floor(Math.random() * 10),

        candle: Math.floor(Math.random() * 10),

        incense: Math.floor(Math.random() * 10),

        charm: Math.floor(Math.random() * 10)

      };

      renderStudioUI();

    };

    // --- Sky & Fireworks ---

    function initSkyEffects() {

      const starsContainer = document.getElementById('starsContainer');

      for (let i = 0; i < 65; i++) {

        const star = document.createElement('div');

        star.className = 'star';

        const size = Math.random() * 2.5 + 1;

        star.style.width = `${size}px`;

        star.style.height = `${size}px`;

        star.style.left = `${Math.random() * 100}%`;

        star.style.top = `${Math.random() * 88}%`;

        star.style.setProperty('--dur', `${2 + Math.random() * 3}s`);

        starsContainer.appendChild(star);

      }

    }

    const fwCanvas = document.getElementById('fireworksCanvas');

    const fwCtx = fwCanvas.getContext('2d');

    let particles = [];

    function resizeFwCanvas() {

      fwCanvas.width = window.innerWidth;

      fwCanvas.height = window.innerHeight * 0.56;

    }

    window.addEventListener('resize', resizeFwCanvas);

    resizeFwCanvas();

    function spawnFirework(x, y) {

      const colors = ['#ffd166', '#80ed99', '#ff9f1c', '#fff3b0', '#4cc9f0'];

      const color = colors[Math.floor(Math.random() * colors.length)];

      for (let i = 0; i < 36; i++) {

        const angle = (Math.PI * 2 * i) / 36;

        const speed = 1.5 + Math.random() * 3.2;

        particles.push({

          x, y,

          vx: Math.cos(angle) * speed,

          vy: Math.sin(angle) * speed,

          alpha: 1,

          color

        });

      }

    }

    function animateFireworks() {

      fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);

      if (Math.random() < 0.016) {

        spawnFirework(

          fwCanvas.width * (0.15 + Math.random() * 0.7),

          fwCanvas.height * (0.15 + Math.random() * 0.45)

        );

      }

      for (let i = particles.length - 1; i >= 0; i--) {

        const p = particles[i];

        p.x += p.vx;

        p.y += p.vy;

        p.vy += 0.035;

        p.alpha -= 0.016;

        if (p.alpha <= 0) {

          particles.splice(i, 1);

          continue;

        }

        fwCtx.globalAlpha = p.alpha;

        fwCtx.fillStyle = p.color;

        fwCtx.beginPath();

        fwCtx.arc(p.x, p.y, 2.2, 0, Math.PI * 2);

        fwCtx.fill();

      }

      fwCtx.globalAlpha = 1;

      requestAnimationFrame(animateFireworks);

    }

    animateFireworks();

    // --- Real-time Eco Counter Sync ---

    onValue(totalCountRef, (snapshot) => {

      const dbCount = snapshot.val() || 0;

      const total = BASE_INITIAL_COUNT + dbCount;

      const waste = (total * 0.35).toFixed(1);

      const carbon = (total * 0.52).toFixed(1);

      document.getElementById('statCount').textContent = total.toLocaleString('en-US');

      document.getElementById('statWaste').textContent = Number(waste).toLocaleString('en-US', { minimumFractionDigits: 1 });

      document.getElementById('statCarbon').textContent = Number(carbon).toLocaleString('en-US', { minimumFractionDigits: 1 });

      const dash = document.getElementById('ecoDashboard');

      dash.classList.add('pulse');

      setTimeout(() => dash.classList.remove('pulse'), 1400);

    });

    // --- Real-time River Listener ---

    const riverArea = document.getElementById('riverArea');

    const recentKrathongsQuery = query(krathongsRef, limitToLast(35));

    onChildAdded(recentKrathongsQuery, (snapshot) => {

      const key = snapshot.key;

      const val = snapshot.val();

      if (!val || document.getElementById(`dom-${key}`)) return;

      const isMine = (key === myKrathongId);

      const kData = {

        id: key,

        name: val.name || 'ผู้ใจบุญรักษ์โลก',

        wish: val.wish || SAMPLE_WISHES[0],

        design: val.design || { base: 0, petal: 0, flower: 0, candle: 0, incense: 0, charm: 0 },

        x: isMine ? 28 : Math.random() * 88,

        y: val.y || (14 + Math.random() * 62),

        speed: 0.011 + Math.random() * 0.006,

        isMine: isMine

      };

      if (isMine) {

        myKrathongData = kData;

        document.getElementById('myCardBtn').style.display = 'inline-flex';

      }

      addKrathongToRiver(kData);

      if (activeKrathongs.length > 40) {

        const oldest = activeKrathongs.shift();

        if (oldest && oldest.el && !oldest.isMine) {

          oldest.el.remove();

        }

      }

    });

    function addKrathongToRiver(kData) {

      const el = document.createElement('div');

      el.className = `krathong-item ${kData.isMine ? 'is-mine' : ''}`;
el.id = `dom-${kData.id}`;

      const scale = 0.72 + (kData.y / 100) * 0.48;

      el.style.top = `${kData.y}%`;

      el.style.left = `${kData.x}%`;

      el.style.zIndex = Math.floor(kData.y);

      el.style.transform = `scale(${scale})`;

      el.style.setProperty('--bob-dur', `${3 + Math.random() * 1.5}s`);

      const prefix = kData.isMine ? '⭐ ' : '🪷 ';

      el.innerHTML = `
<div class="krathong-bob">
<div class="krathong-label">${prefix}${escapeHtml(kData.name)}</div>

          ${buildCustomKrathongSVG(kData.design, 112)}
<div class="ripple-ring"></div>
</div>

      `;

      el.onclick = () => openEcardModal(kData);

      riverArea.appendChild(el);

      kData.el = el;

      activeKrathongs.push(kData);

    }

    function animateRiver() {

      activeKrathongs.forEach(k => {

        k.x += k.speed;

        if (k.x > 105) k.x = -15;

        if (k.el) k.el.style.left = `${k.x}%`;

      });

      requestAnimationFrame(animateRiver);

    }

    function escapeHtml(str) {

      return String(str).replace(/[&<>"']/g, m => ({

        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'

      }[m]));

    }

    // --- E-Card Generator (1080x1920 PNG) ---

    function generateEcardImage(kData, callback) {

      const canvas = document.getElementById('ecardCanvas');

      const ctx = canvas.getContext('2d');

      const W = 1080;

      const H = 1920;

      const bgGrad = ctx.createLinearGradient(0, 0, 0, H);

      bgGrad.addColorStop(0, '#060c1f');

      bgGrad.addColorStop(0.45, '#11264f');

      bgGrad.addColorStop(0.62, '#1b3b6f');

      bgGrad.addColorStop(0.63, '#0b203d');

      bgGrad.addColorStop(1, '#040b18');

      ctx.fillStyle = bgGrad;

      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = '#ffffff';

      for (let i = 0; i < 70; i++) {

        const sx = (i * 173) % W;

        const sy = (i * 97) % (H * 0.52);

        const sr = (i % 3) + 1.2;

        ctx.globalAlpha = 0.35 + (i % 5) * 0.12;

        ctx.beginPath();

        ctx.arc(sx, sy, sr, 0, Math.PI * 2);

        ctx.fill();

      }

      ctx.globalAlpha = 1;

      const moonX = W * 0.78;

      const moonY = H * 0.16;

      const moonGlow = ctx.createRadialGradient(moonX, moonY, 30, moonX, moonY, 240);

      moonGlow.addColorStop(0, 'rgba(255, 236, 153, 0.55)');

      moonGlow.addColorStop(1, 'rgba(255, 209, 102, 0)');

      ctx.fillStyle = moonGlow;

      ctx.beginPath();

      ctx.arc(moonX, moonY, 240, 0, Math.PI * 2);

      ctx.fill();

      ctx.fillStyle = '#fff3b0';

      ctx.beginPath();

      ctx.arc(moonX, moonY, 78, 0, Math.PI * 2);

      ctx.fill();

      ctx.strokeStyle = 'rgba(255, 209, 102, 0.55)';

      ctx.lineWidth = 4;

      ctx.strokeRect(48, 48, W - 96, H - 96);

      ctx.strokeStyle = 'rgba(255, 209, 102, 0.25)';

      ctx.lineWidth = 2;

      ctx.strokeRect(64, 64, W - 128, H - 128);

      ctx.textAlign = 'center';

      ctx.fillStyle = '#ffd166';

      ctx.font = 'bold 64px "Prompt", sans-serif';

      ctx.fillText('ลอยกระทงออนไลน์', W / 2, 185);

      ctx.fillStyle = 'rgba(45, 106, 79, 0.85)';

      roundRect(ctx, W / 2 - 220, 215, 440, 56, 28);

      ctx.fill();

      ctx.strokeStyle = '#95d5b2';

      ctx.lineWidth = 2;

      ctx.stroke();

      ctx.fillStyle = '#e9f5db';

      ctx.font = '500 28px "Prompt", sans-serif';

      ctx.fillText('🌱 รักษ์โลก ลดโลกร้อน • Zero Waste', W / 2, 253);

      ctx.fillStyle = 'rgba(9, 20, 42, 0.72)';

      roundRect(ctx, 110, 330, W - 220, 560, 36);

      ctx.fill();

      ctx.strokeStyle = 'rgba(255, 209, 102, 0.4)';

      ctx.lineWidth = 2.5;

      ctx.stroke();

      ctx.fillStyle = '#95d5b2';

      ctx.font = '500 30px "Prompt", sans-serif';

      ctx.fillText('คำอธิษฐานของ', W / 2, 415);

      ctx.fillStyle = '#ffd166';

      ctx.font = 'bold 48px "Prompt", sans-serif';

      ctx.fillText(kData.name, W / 2, 485);

      ctx.strokeStyle = 'rgba(255, 209, 102, 0.3)';

      ctx.beginPath();

      ctx.moveTo(260, 525);

      ctx.lineTo(W - 260, 525);

      ctx.stroke();

      ctx.fillStyle = '#f8fafc';

      ctx.font = '400 38px "Prompt", sans-serif';

      wrapThaiText(ctx, `“${kData.wish}”`, W / 2, 600, W - 300, 58);

      const kCenterY = 1280;

      ctx.strokeStyle = 'rgba(144, 224, 239, 0.32)';

      ctx.lineWidth = 3;

      ctx.beginPath();

      ctx.ellipse(W / 2, kCenterY + 135, 240, 42, 0, 0, Math.PI * 2);

      ctx.stroke();

      ctx.beginPath();

      ctx.ellipse(W / 2, kCenterY + 135, 330, 62, 0, 0, Math.PI * 2);

      ctx.stroke();

      const svgString = buildCustomKrathongSVG(kData.design, 440);

      const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });

      const url = URL.createObjectURL(svgBlob);

      const img = new Image();

      img.onload = () => {

        ctx.drawImage(img, W / 2 - 220, kCenterY - 220, 440, 440);

        URL.revokeObjectURL(url);

        ctx.fillStyle = 'rgba(128, 237, 153, 0.9)';

        ctx.font = '500 30px "Prompt", sans-serif';

        ctx.fillText('ร่วมลดขยะในแม่น้ำ 0.35 กก. และลดคาร์บอน 0.52 kgCO₂e', W / 2, 1690);

        const today = new Date().toLocaleDateString('th-TH', {

          year: 'numeric', month: 'long', day: 'numeric'

        });

        ctx.fillStyle = '#94a3b8';

        ctx.font = '400 26px "Prompt", sans-serif';

        ctx.fillText(`วันลอยกระทง • ${today}`, W / 2, 1750);

        callback(canvas.toDataURL('image/png'));

      };

      img.src = url;

    }

    function roundRect(ctx, x, y, w, h, r) {

      ctx.beginPath();

      ctx.moveTo(x + r, y);

      ctx.arcTo(x + w, y, x + w, y + h, r);

      ctx.arcTo(x + w, y + h, x, y + h, r);

      ctx.arcTo(x, y + h, x, y, r);

      ctx.arcTo(x, y, x + w, y, r);

      ctx.closePath();

    }

    function wrapThaiText(ctx, text, x, startY, maxWidth, lineHeight) {

      let segments = [];

      if (typeof Intl !== 'undefined' && Intl.Segmenter) {

        const segmenter = new Intl.Segmenter('th', { granularity: 'word' });

        segments = Array.from(segmenter.segment(text)).map(s => s.segment);

      } else {

        segments = text.split('');

      }

      let line = '';

      let y = startY;

      for (let i = 0; i < segments.length; i++) {

        const testLine = line + segments[i];

        if (ctx.measureText(testLine).width > maxWidth && line !== '') {

          ctx.fillText(line.trim(), x, y);

          line = segments[i];

          y += lineHeight;

        } else {

          line = testLine;

        }

      }

      if (line.trim()) ctx.fillText(line.trim(), x, y);

    }

    // --- Modal & Event Handlers ---

    const createModal = document.getElementById('createModal');

    const ecardModal = document.getElementById('ecardModal');

    const toastEl = document.getElementById('toast');

    function showToast(msg) {

      toastEl.textContent = msg;

      toastEl.classList.add('show');

      setTimeout(() => toastEl.classList.remove('show'), 3000);

    }

    document.getElementById('openCreateBtn').onclick = () => {

      renderStudioUI();

      createModal.classList.add('active');

    };

    document.getElementById('closeCreateModal').onclick = () => createModal.classList.remove('active');

    document.getElementById('closeEcardModal').onclick = () => ecardModal.classList.remove('active');

    document.getElementById('randomWishBtn').onclick = () => {

      const wishInput = document.getElementById('userWishInput');

      wishInput.value = SAMPLE_WISHES[Math.floor(Math.random() * SAMPLE_WISHES.length)];

    };

    document.getElementById('launchBtn').onclick = async () => {

      const nameVal = document.getElementById('userNameInput').value.trim() || 'ผู้ใจบุญรักษ์โลก';

      const wishVal = document.getElementById('userWishInput').value.trim() || SAMPLE_WISHES[0];

      const launchBtn = document.getElementById('launchBtn');

      launchBtn.disabled = true;

      launchBtn.textContent = '⏳ กำลังปล่อยกระทงลงน้ำ...';

      try {

        const newPayload = {

          name: nameVal,

          wish: wishVal,

          design: { ...currentDesign },

          y: Math.floor(20 + Math.random() * 50),

          createdAt: Date.now()

        };

        const pushedRef = await push(krathongsRef, newPayload);

        myKrathongId = pushedRef.key;

        myKrathongData = { id: myKrathongId, ...newPayload, isMine: true };

        localStorage.setItem(STORAGE_MY_ID, myKrathongId);

        localStorage.setItem(STORAGE_MY_DATA, JSON.stringify(myKrathongData));

        await runTransaction(totalCountRef, (current) => (current || 0) + 1);

        spawnFirework(fwCanvas.width * 0.3, fwCanvas.height * 0.3);

        setTimeout(() => spawnFirework(fwCanvas.width * 0.7, fwCanvas.height * 0.25), 250);

        createModal.classList.remove('active');

        document.getElementById('myCardBtn').style.display = 'inline-flex';

        showToast('🪷 ปล่อยกระทงที่แต่งเองลงน้ำเรียบร้อยแล้ว!');

        setTimeout(() => openEcardModal(myKrathongData), 650);

      } catch (err) {

        console.error(err);

        showToast('⚠️ เชื่อมต่อฐานข้อมูลไม่สำเร็จ กรุณาเช็ก databaseURL หรือ Rules');

      } finally {

        launchBtn.disabled = false;

        launchBtn.innerHTML = '🕯️ อธิษฐานและปล่อยกระทงลงน้ำ';

      }

    };

    document.getElementById('myCardBtn').onclick = () => {

      if (myKrathongData) openEcardModal(myKrathongData);

    };

    function openEcardModal(kData) {

      currentViewedKrathong = kData;

      document.getElementById('ecardModalTitle').textContent =

        kData.isMine ? 'การ์ดคำอธิษฐานของคุณ' : `คำอธิษฐานของ ${kData.name}`;

      generateEcardImage(kData, (dataUrl) => {

        document.getElementById('ecardPreviewImg').src = dataUrl;

        ecardModal.classList.add('active');

      });

    }

    document.getElementById('downloadCardBtn').onclick = () => {

      const imgSrc = document.getElementById('ecardPreviewImg').src;

      if (!imgSrc) return;

      const link = document.createElement('a');

      link.download = `loy-krathong-${Date.now()}.png`;

      link.href = imgSrc;

      link.click();

      showToast('📥 บันทึกการ์ดภาพ PNG เรียบร้อยแล้ว');

    };

    document.getElementById('copyWishBtn').onclick = () => {

      if (!currentViewedKrathong) return;

      const text = `🪷 ลอยกระทงออนไลน์ รักษ์โลก ลดโลกร้อน\nของ: ${currentViewedKrathong.name}\n“${currentViewedKrathong.wish}”`;

      navigator.clipboard.writeText(text).then(() => {

        showToast('📋 คัดลอกคำอธิษฐานแล้ว นำไปวางแชร์ได้เลย');

      });

    };

    // Restore saved user info

    const savedLocal = localStorage.getItem(STORAGE_MY_DATA);

    if (savedLocal) {

      try {

        myKrathongData = JSON.parse(savedLocal);

        document.getElementById('userNameInput').value = myKrathongData.name || '';

        document.getElementById('userWishInput').value = myKrathongData.wish || '';

        if (myKrathongData.design) currentDesign = { ...myKrathongData.design };

        document.getElementById('myCardBtn').style.display = 'inline-flex';

      } catch (e) {}

    }

    initSkyEffects();

    animateRiver();
</script>
